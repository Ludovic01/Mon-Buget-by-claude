plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monbudget.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.monbudget.app"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Clé de signature fixe : les mises à jour s'installent par-dessus
    // l'ancienne version sans perdre vos données.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
